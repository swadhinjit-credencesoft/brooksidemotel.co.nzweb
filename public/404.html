<!DOCTYPE html>
<html lang="en-NZ">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Page Not Found | Brookside Motel, Rolleston</title>
    <meta
      name="description"
      content="The page you are looking for could not be found. Return to Brookside Motel, Rolleston — brand-new luxury motel accommodation in Canterbury."
    />
    <meta name="robots" content="noindex, follow" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #efe6dd;
        color: #20302b;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        font-size: 16px;
        line-height: 1.6;
        text-align: center;
        padding: 48px 24px;
        -webkit-font-smoothing: antialiased;
      }
      .nf {
        max-width: 640px;
      }
      .nf-code {
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.5em;
        text-transform: uppercase;
        color: #835c21;
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(28px, 5vw, 40px);
        line-height: 1.15;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .nf-lead {
        margin: 0 auto 32px;
        max-width: 52ch;
        font-size: 17px;
        font-weight: 300;
        line-height: 1.7;
      }
      .nf-actions {
        display: flex;
        gap: 14px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 15px 28px;
        border: none;
        border-radius: 4px;
        font-family: inherit;
        font-size: 12.5px;
        font-weight: 500;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        text-decoration: none;
        transition: background 0.28s, color 0.28s;
      }
      .btn-primary {
        background: #3a4e48;
        color: #efe6dd;
      }
      .btn-primary:hover {
        background: #1f2d29;
      }
      .btn-ghost {
        background: transparent;
        color: #3a4e48;
        border: 1px solid #c0d3cd;
      }
      .btn-ghost:hover {
        background: #3a4e48;
        color: #efe6dd;
        border-color: #3a4e48;
      }
      .nf-help {
        margin: 32px 0 0;
        font-size: 13px;
        color: #4e645e;
      }
      .nf-help a {
        color: #835c21;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .nf-help a:hover {
        color: #6e4d19;
      }
      @media (max-width: 480px) {
        body {
          padding: 32px 16px;
        }
        .nf-actions {
          flex-direction: column;
          width: 100%;
        }
        .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="nf">
      <p class="nf-code">404</p>
      <h1>This page seems to have wandered off</h1>
      <p class="nf-lead">
        The page you are looking for could not be found. It might have been
        moved, renamed, or never existed &mdash; it&rsquo;s just an accident
        that was not intentional.
      </p>
      <div class="nf-actions">
        <a class="btn btn-primary" href="/">Back to home</a>
        <a class="btn btn-ghost" href="/motel-rooms">Browse rooms</a>
      </div>
      <p class="nf-help">
        Or reach us directly &mdash; <a href="tel:+6439300060">+64 3 930 0060</a> or
        <a href="mailto:reservations@brooksidemotel.co.nz">reservations@brooksidemotel.co.nz</a>
      </p>
    </main>
  </body>
</html>
